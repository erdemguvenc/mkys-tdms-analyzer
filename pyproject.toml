[project]
name = "mkys-tdms-analyzer"
version = "0.1.0"
description = "MKYS - TDMS reconciliation and reporting tool"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Erdem Güvenç" }
]

dependencies = [
    "pandas",
    "openpyxl",
    "xlrd",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "types-openpyxl>=3.1.5.20260724",
]

[tool.mypy]
python_version = "3.14"

# Analiz edilecek kaynak kod
files = ["src"]

# Tip kontrolü
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# Uyarılar
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Şimdilik üçüncü parti kütüphaneler
